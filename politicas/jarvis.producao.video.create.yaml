# Contrato de execução do daemon para PRODUZIR VÍDEOS.
#
# ⚠️ ESTA É A TERCEIRA INTENÇÃO INSTRUMENTADA, e ela existe para testar o que
# as outras duas não testam:
#
#     volume          60 ciclos/hora, contra 1 poda/dia
#     efeito parcial  pedir 4 e sair 2 não é sucesso nem falha
#     custo           a primeira ação com dinheiro atrelado
#
# 📌 E ela nasce sabendo que vai expor um buraco. Ver `verificacao.espera`
# lá embaixo.

agente: jarvis.producao
acao: video.create
versao: v1
autoridade: L1

# ⚠️ `observe` NÃO INTERROMPE NADA. Produção de vídeo é a linha de montagem do
# Jarvis inteiro; uma camada nova bloqueando isso no primeiro dia seria
# exatamente o que a ESCOPO promete não fazer.
modo: observe

# ⚠️ A EVIDÊNCIA SEM A QUAL ESTA AÇÃO NÃO PODE SER JULGADA.
#
# `_carregar_produtos_para_produzir()` tem DOIS `except` que viram
# `log.warning` e caem para `return []`. O chamador lê "nenhum produto
# disponível pra produzir" — que é indistinguível de "a fila está vazia".
# É o bug das 36 fontes, no terceiro arquivo do projeto.
#
# 📌 Com esta evidência declarada, uma falha de leitura vira HOLD com o motivo
# escrito no recibo, em vez de um ciclo que produz zero e parece normal.
evidencias:
  - id: fila_de_produtos
    descricao: fila de produtos validados (validacao_fila.json ou produtos_fila.json)
    exige_procedencia: true

# ⚠️ AS REGRAS DECIDEM POR QUANTIDADE, E NÃO POR CUSTO — e o motivo MUDOU.
#
# Era: `Intencao.custo` nascia `0.0` e "não declarado" era indistinguível de
# "de graça", então uma regra `custo > 50 → HOLD` liberaria um lote caro em
# toda máquina onde o operador esquecesse de declarar o valor unitário.
#
# ✅ Isso foi consertado no núcleo em 16/09: custo não declarado é `null`, e
# uma regra que decida por custo SEGURA em vez de liberar por omissão.
#
# ⚠️ O QUE FALTA AGORA É DO OPERADOR, não do código: enquanto
# `ESCOPO_CUSTO_VIDEO` não estiver no `.env` da VPS, o custo desta ação vai ao
# recibo como `null` — e ligar a regra faria TODA produção virar HOLD, o que
# em `observe` não quebra nada mas afoga o sinal de maturidade.
#
# 📌 A regra entra aqui no dia em que o valor unitário for declarado. Até lá o
# recibo diz honestamente que não sabe quanto custou, que é melhor que dizer
# zero.
regras:
  - id: lote_absurdo
    se: {campo: quantidade, op: ">", valor: 20}
    entao: DENY
    motivo: >-
      produzir mais de 20 vídeos numa tacada não é reposição de esteira, é
      config errada ou laço. O teto diário do Jarvis inteiro é menor que isso.

  - id: lote_grande
    se: {campo: quantidade, op: ">", valor: 8}
    entao: HOLD
    motivo: >-
      lote acima de 8 vídeos queima crédito de IA de verdade (Gemini,
      ElevenLabs, fal.ai) e merece gente olhando antes.

padrao: ALLOW

verificacao:
  verificador: jarvis.producao
  tentativas: 3
  # A esteira é disco local: se não apareceu na 1ª, esperar muito não ajuda.
  # As esperas curtas cobrem escrita em andamento, não latência de rede.
  espera_segundos: [0, 5, 20]
  # ⚠️ AQUI ESTÁ O BURACO QUE ESTA INTENÇÃO EXISTE PARA EXPOR.
  #
  # `produzidos: $quantidade` significa "todos os pedidos entraram na esteira".
  # Pedir 4 e sair 2 dá FAILED — e FAILED está tecnicamente certo (a asserção
  # foi contradita pela fonte de verdade), mas perde a informação de que DOIS
  # funcionaram.
  #
  # 📌 A informação NÃO se perde no recibo: o verificador devolve
  # `confirmados`, `faltando` e `pedidos`, e isso fica na evidência da prova.
  # O que falta é o ESTADO saber representar isso — hoje ele é binário.
  #
  # Essa é a lacuna `Partial Effect` do ROADMAP, e ela vale para reembolso em
  # lote, desativação de contas, disparo de e-mail, provisionamento. Vídeo é só
  # o primeiro caso barato de vê-la acontecer.
  espera:
    produzidos: $quantidade
