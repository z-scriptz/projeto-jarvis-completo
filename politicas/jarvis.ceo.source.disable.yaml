# Contrato de execução do ceo_agent para PODAR FONTES.
#
# ⚠️ ESTA POLÍTICA É DO JARVIS, não da biblioteca ESCOPO. Quem decide quantas
# fontes podem cair de uma vez é o dono da operação, não o fornecedor da
# camada de controle. Por isso ela mora aqui e não no escopo-runtime.
#
# POR QUE ELA EXISTE: em 14/09/2026 o `_analisar_fontes()` carimbou 36 fontes
# como MORTA porque `_vendas_por_fonte()` devolveu {} numa falha de consulta,
# e `vendas.get(fonte, {"vendas": 0})` transformou ausência de dado em
# evidência de zero (ceo_agent.py:192). A poda ia comentar as 36.
#
# ⚠️ ORDEM IMPORTA: a primeira regra que casa decide, de cima para baixo.
# O DENY vem antes do HOLD — se o HOLD (>5) viesse primeiro, ele pegaria
# também os casos de >50 e o DENY nunca dispararia.

agente: jarvis.ceo
acao: source.disable
versao: v1
autoridade: L2

# ⚠️ `observe` NÃO BLOQUEIA NADA. Registra o veredito e deixa a poda seguir
# exatamente como hoje. Só vira `enforce` depois de semanas de recibo
# mostrando que os limites abaixo estão nos lugares certos.
modo: observe

# ⚠️ A EVIDÊNCIA SEM A QUAL ESTA AÇÃO NÃO PODE SER JULGADA.
#
# É a generalização do bug que apareceu duas vezes num dia só: em 14/09 o
# veredito MORTA foi emitido sem dado de venda; em 16/09, um nível acima, a
# lista vazia foi lida como "está tudo bem". Os dois são o mesmo erro —
# **agir sem ter a evidência que a decisão exigia**.
#
# 📌 Sem ela o veredito é HOLD, e não DENY, porque a diferença importa:
#
#     DENY   eu sei o bastante, e a ação é proibida
#     HOLD   não tenho evidência suficiente para permitir AGORA
#
# HOLD é reavaliável. Quando a Shopee responder, a mesma intenção passa.
evidencias:
  - id: vendas_por_fonte
    descricao: consulta de vendas da Shopee por perfil-fonte (conversionReport)
    # ⚠️ Não basta dizer "tenho o dado": tem que dizer DE ONDE veio e QUAL era
    # (hash). Sem isso o recibo afirma em vez de provar, e daqui a seis meses
    # ninguém responde qual estado do mundo produziu o veredito.
    #
    # 📌 O ledger guarda a impressão digital e a referência, nunca o dado —
    # prova integridade sem virar vazamento.
    exige_procedencia: true

regras:
  - id: limite_absoluto
    se: {campo: quantidade, op: ">", valor: 50}
    entao: DENY
    motivo: >-
      podar mais de 50 fontes de uma vez não é decisão operacional, é
      incidente. Toda a base de perfis tem essa ordem de grandeza.

  - id: lote_destrutivo
    se: {campo: quantidade, op: ">", valor: 5}
    entao: HOLD
    motivo: >-
      poda em lote acima de 5 fontes precisa de gente olhando. Foi
      exatamente assim que 36 caíram por causa de uma consulta que falhou.

padrao: ALLOW

verificacao:
  verificador: jarvis.fontes
  tentativas: 3
  # Os arquivos de perfil são locais: se não deu na 1ª, esperar muito não
  # ajuda. As esperas curtas cobrem escrita em andamento, não latência de rede.
  espera_segundos: [0, 2, 10]
  # ⚠️ CONFIRMA OS ALVOS DESTA AÇÃO, um por um — não o total de podas do dia.
  #
  # A primeira versão comparava com um contador global de linhas marcadas
  # hoje, e isso produziria falso positivo: uma poda bem-sucedida às 10h
  # deixaria 5 marcas, e uma RECUSA às 11h (0 alvos, espera 0) seria acusada
  # de ter falhado por causa das marcas da rodada anterior.
  #
  # Em dry-run nada é escrito, e o verificador sabe disso: ele espera 0
  # confirmados. Ver `escopo_jarvis.VerificadorPerfis`.
  espera:
    confirmados: $quantidade

  # ⚠️ O QUE ESTA AÇÃO EXIGE QUE ALGUÉM SUSTENTE. Ver AFIRMACOES.md.
  #
  # 📌 Mora no CONTRATO e não no verificador: o verificador declara o que
  # SABE avaliar, e a diferença entre as duas listas é a lacuna que aparece
  # no recibo. Se a mesma pessoa escrevesse as duas, elas bateriam por
  # construção e a lacuna nunca apareceria.
  afirmacoes_exigidas:
    - source.prune_mark_written
    # 🔥 NINGUÉM COBRE ESTA, e ela fica aqui por isso. Comentar a linha no
    # arquivo de perfil não prova que o coletor parou de coletar da fonte —
    # e é essa a consequência que importa. O recibo vai dizer sozinho que
    # ela ficou fora do alcance.
    - source.collector_stopped_reading
